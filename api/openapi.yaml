openapi: 3.0.3
info:
  title: Fifty Fifty API
  version: 0.0.0
  description: Group expense splitting. Synthetic data only; settlement is simulated.
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      summary: Liveness. Does not touch dependencies.
      security: []
      responses:
        "200":
          description: Process is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
  /readyz:
    get:
      summary: Readiness. Checks Postgres connectivity.
      security: []
      responses:
        "200":
          description: Database reachable.
          content:
            application/json:
              schema:
                type: object
                required: [status, db]
                properties:
                  status: { type: string, enum: [ok] }
                  db: { type: string, enum: [up] }
        "503":
          description: Database unreachable.
          content:
            application/json:
              schema:
                type: object
                required: [status, db]
                properties:
                  status: { type: string, enum: [unavailable] }
                  db: { type: string, enum: [down] }
  /v1/me:
    get:
      summary: The authenticated user. Provisions the user on first valid token.
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/groups:
    get:
      summary: Groups the caller belongs to (newest first, at most 100).
      responses:
        "200":
          description: Groups.
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Create a group. The caller becomes its owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, currency]
              properties:
                name: { type: string, minLength: 1, maxLength: 100, description: Trimmed before validation. }
                currency: { type: string, enum: [CAD, USD] }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/groups/{id}:
    get:
      summary: A group and its members. 404 if it does not exist or the caller is not a member (indistinguishable by design).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Group detail.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Group"
                  - type: object
                    required: [members]
                    properties:
                      members:
                        type: array
                        items:
                          type: object
                          required: [user_id, display_name, role, joined_at]
                          properties:
                            user_id: { type: string, format: uuid }
                            display_name: { type: string }
                            role: { type: string, enum: [owner, member] }
                            joined_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/groups/{id}/join-codes:
    parameters:
      - { $ref: "#/components/parameters/GroupId" }
    post:
      summary: Create a join code (owner only). The plaintext code is returned once and never again.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                max_uses: { type: integer, minimum: 1, maximum: 50, default: 5 }
                expires_in_hours: { type: integer, minimum: 1, maximum: 168, default: 72 }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedJoinCode" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      summary: List the group's join codes (owner only). Metadata only, never the code.
      responses:
        "200":
          description: Join codes, newest first, at most 100.
          content:
            application/json:
              schema:
                type: object
                required: [join_codes]
                properties:
                  join_codes:
                    type: array
                    items: { $ref: "#/components/schemas/JoinCode" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/groups/{id}/join-codes/{codeId}:
    delete:
      summary: Revoke a join code (owner only). Idempotent.
      parameters:
        - { $ref: "#/components/parameters/GroupId" }
        - { name: codeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Revoked (or already revoked). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/groups/{id}/balances:
    parameters:
      - { $ref: "#/components/parameters/GroupId" }
    get:
      summary: Every member's net balance in the group, plus suggested transfers to settle up (any member).
      description: >
        A balance is the sum of the member's ledger entries in this group: positive means the group
        owes them, negative means they owe the group. All current members are listed, including those
        at zero. Balances always sum to zero. `suggested_transfers` are derived at read time by a greedy
        heuristic (the member owed the most is paid by the member who owes the most, repeatedly); it
        reduces the number of payments but does NOT guarantee the minimum, and it only suggests:
        nothing is posted. Both fields come from one snapshot, so applying the transfers to the
        balances always gives all zeros. 404 if the caller is not in the group (or it does not exist).
      responses:
        "200":
          description: Balances and suggested transfers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Balances" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/groups/{id}/expenses:
    parameters:
      - { $ref: "#/components/parameters/GroupId" }
    post:
      summary: Create an expense with its items (any member). The caller becomes the payer. Requires Idempotency-Key.
      description: >
        Starts in status `claiming`. The total is derived (sum of item prices + tax + tip), never
        sent. Every item is one claimable unit; there is no quantity field. Amounts are integers in
        minor units (cents), at most 100000000 each; fractional or float values are rejected.
        Tax and tip must be 0 when every item is free. Responses below 500 are stored under the key
        for 24 hours and replayed (header Idempotent-Replayed: true); the same key with a different
        request is 422. Requests that mean the same thing (whitespace, key order, omitted zero tax)
        count as the same request. A caller who is not in the group gets 404 before the body or the
        key is looked at.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [description, items]
              properties:
                description: { type: string, minLength: 1, maxLength: 200, description: Trimmed before validation. }
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties: false
                    required: [description, price_minor]
                    properties:
                      description: { type: string, minLength: 1, maxLength: 200, description: Trimmed before validation. }
                      price_minor: { type: integer, format: int64, minimum: 0, maximum: 100000000 }
                tax_minor: { type: integer, format: int64, minimum: 0, maximum: 100000000, default: 0 }
                tip_minor: { type: integer, format: int64, minimum: 0, maximum: 100000000, default: 0 }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expense" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/KeyReuse" }
    get:
      summary: The group's expenses, newest first (any member).
      responses:
        "200":
          description: At most 100 expenses (no pagination yet).
          content:
            application/json:
              schema:
                type: object
                required: [expenses]
                properties:
                  expenses:
                    type: array
                    items: { $ref: "#/components/schemas/ExpenseSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/groups/{id}/expenses/{expenseId}:
    get:
      summary: One expense with its items and who claimed each (any member). 404 if the caller is not in the group, the expense does not exist, or it belongs to another group (indistinguishable by design).
      parameters:
        - { $ref: "#/components/parameters/GroupId" }
        - { name: expenseId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Expense detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expense" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/groups/{id}/expenses/{expenseId}/finalize:
    post:
      summary: Finalize an expense into ledger entries (payer only). Requires Idempotency-Key.
      description: >
        Allowed only while the expense is `claiming` and every item has a claimant. If some items
        are unclaimed, the payer may pass `split_rest_among`: those items are then split evenly among
        the listed members, recorded as real claims. Each item's price is split evenly among its
        claimants; tax and tip are prorated by each member's claimed subtotal; remainders go to the
        largest fractional remainder, ties to the lowest member id. In one transaction the ledger
        gets a posting that sums to zero (the payer is credited what the others owe, each other
        claimant is debited their share), the expense becomes `finalized`, and an audit event is
        written. Claims racing the finalize either make it into the posting or are refused with 409;
        none are accepted afterwards. Responses below 500 are stored under the key for 24 hours and
        replayed (header Idempotent-Replayed: true), including 409s, so after fixing a 409 (for
        example by claiming the missing items) retry with a NEW key. A caller who is not in the
        group gets 404; a member who is not the payer gets 403; both before the key or body are read.
      parameters:
        - { $ref: "#/components/parameters/GroupId" }
        - { name: expenseId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                split_rest_among:
                  type: array
                  maxItems: 100
                  description: Distinct members of the group who share any unclaimed items evenly. Ignored when every item is already claimed.
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: Finalized.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinalizedExpense" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The caller is in the group but is not this expense's payer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            `invalid_state` (the expense is not `claiming`, including already finalized) or
            `items_unclaimed` (some items have no claimant and no split_rest_among was given).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/KeyReuse" }
  /v1/groups/{id}/expenses/{expenseId}/void:
    post:
      summary: Void a finalized expense (the payer or the group owner). Requires Idempotency-Key.
      description: >
        Cancels a finalized expense by appending a second ledger transaction whose entries are the
        exact negation of the finalize posting. Nothing already on the ledger is changed or deleted, and
        every balance returns to what it would have been had the expense never been finalized. The
        claims are left as they were. In one transaction the expense becomes `void` and an audit event
        is written. Only a `finalized` expense can be voided; anything else is 409 `invalid_state`
        (including an expense that is already void). A void after later settlements can leave a pair
        overpaid, so a balance may change sign; that is correct bookkeeping, not an error.
        Responses below 500 are stored under the key for 24 hours and replayed (header
        Idempotent-Replayed: true). A caller who is not in the group gets 404; a member who is
        neither the payer nor the owner gets 403; both before the key is read.
      parameters:
        - { $ref: "#/components/parameters/GroupId" }
        - { name: expenseId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false, description: "No fields; an empty body or {} is accepted." }
      responses:
        "200":
          description: Voided.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoidedExpense" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The caller is in the group but is neither this expense's payer nor the group owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The expense is not `finalized` (`invalid_state`), for example still claiming or already void.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/KeyReuse" }
  /v1/groups/{id}/expenses/{expenseId}/items/{itemId}/claim:
    parameters:
      - { $ref: "#/components/parameters/GroupId" }
      - { name: expenseId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      summary: Claim an item for yourself (any member). Idempotent; no Idempotency-Key needed.
      description: >
        A member can only claim for themselves. Claiming an item you already hold changes nothing.
        Only allowed while the expense is `claiming`; otherwise 409. Claimers do not block one another;
        a claim that arrives while the expense is being finalized waits for it and then gets 409.
        404 if the caller is not in the group, or the expense does not exist or is in another group
        (`expense not found`, indistinguishable), or the item is not in this expense (`item not found`).
      responses:
        "200":
          description: The item with its current claimants.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/NotClaimable" }
    delete:
      summary: Remove your own claim on an item (any member). Idempotent.
      description: Removes only the caller's claim. Unclaiming an item you do not hold is a no-op. Same 404 and 409 rules as claiming.
      responses:
        "204": { description: Your claim is gone (or never existed). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/NotClaimable" }
  /v1/groups/{id}/settlements:
    parameters:
      - { $ref: "#/components/parameters/GroupId" }
    post:
      summary: Record a payment from yourself to another member through the simulated payment provider (any member). Requires Idempotency-Key.
      description: >
        Settlement is SIMULATED: the provider is a mock server and no real money moves. The caller is
        always the sender (there is no `from` field). The settlement is created `pending`, a
        `settlement.execute` job is enqueued in the same transaction, and the response is 202; poll
        `GET .../settlements/{settlementId}` for the outcome. The ledger is posted only when the
        settlement succeeds, and exactly once. The ledger keeps net balances, not pairwise debts, so the
        amount may be at most `min(what you owe the group, what the group owes the payee)`, each reduced
        by your or their open (`pending` or `unknown`) settlements; more is 409 `exceeds_available`.
        This can differ from `suggested_transfers`, which ignores open settlements. Creation is
        serialized per group, so concurrent requests cannot reserve the same money twice. Responses below
        500 are stored under the key for 24 hours and replayed (header Idempotent-Replayed: true),
        including 409: after a 409, retry with a NEW key. A caller who is not in the group gets 404
        before the key or the body is looked at.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [to_member_id, amount_minor]
              properties:
                to_member_id: { type: string, format: uuid, description: Another member of this group. }
                amount_minor: { type: integer, format: int64, minimum: 1, maximum: 100000000, description: Minor units, in the group's currency. }
      responses:
        "202":
          description: Accepted; the settlement is `pending`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settlement" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The amount is more than can be settled between these two members right now (`exceeds_available`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/KeyReuse" }
    get:
      summary: List the group's settlements, newest first, at most 100 (any member).
      description: 404 if the caller is not in the group (or it does not exist).
      responses:
        "200":
          description: Settlements.
          content:
            application/json:
              schema:
                type: object
                required: [settlements]
                properties:
                  settlements:
                    type: array
                    items: { $ref: "#/components/schemas/Settlement" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/groups/{id}/settlements/{settlementId}:
    get:
      summary: Read one settlement (any member). Poll this for the outcome.
      description: >
        404 if the caller is not in the group, or the settlement does not exist or is in another
        group (`settlement not found`, indistinguishable).
      parameters:
        - { $ref: "#/components/parameters/GroupId" }
        - { name: settlementId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The settlement.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settlement" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/join:
    post:
      summary: Join a group with a code. Requires Idempotency-Key; rate limited per user.
      description: >
        Responses with status below 500 are stored under the key for 24 hours and replayed
        (header Idempotent-Replayed: true), including 404 for an unusable code. The same key
        with a different code is 422. Invalid, expired, revoked and used-up codes are
        indistinguishable (all 404).
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, example: ABCD-EFGH-JKMN, description: "12 characters; case, hyphens and spaces are ignored." }
      responses:
        "200":
          description: Already a member; no use consumed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "201":
          description: Joined.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/KeyReuse" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
components:
  parameters:
    GroupId:
      { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 1-255 visible ASCII characters, e.g. a UUID. Scoped per user; kept 24 hours.
      schema: { type: string, minLength: 1, maxLength: 255 }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: OIDC token (RS256) from the configured issuer; audience must be the api's client id.
  schemas:
    JoinCode:
      type: object
      required: [id, max_uses, uses, expires_at, revoked_at, created_at, status]
      properties:
        id: { type: string, format: uuid }
        max_uses: { type: integer }
        uses: { type: integer }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        status: { type: string, enum: [active, exhausted, expired, revoked] }
    CreatedJoinCode:
      type: object
      required: [id, code, max_uses, expires_at, created_at]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: ABCD-EFGH-JKMN, description: Shown once. Only a hash is stored. }
        max_uses: { type: integer }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    Me:
      type: object
      required: [id, email, display_name]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        display_name: { type: string }
    Group:
      type: object
      required: [id, name, currency, role, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        currency: { type: string, enum: [CAD, USD] }
        role: { type: string, enum: [owner, member], description: The caller's role. }
        created_at: { type: string, format: date-time }
    ExpenseItem:
      type: object
      required: [id, position, description, price_minor, claimed_by]
      properties:
        id: { type: string, format: uuid }
        position: { type: integer, description: Zero-based display order. }
        description: { type: string }
        price_minor: { type: integer, format: int64 }
        claimed_by:
          type: array
          description: Ids of the members who claimed this item, sorted.
          items: { type: string, format: uuid }
    Expense:
      type: object
      required: [id, group_id, payer_id, description, status, version, currency, tax_minor, tip_minor, subtotal_minor, total_minor, created_at, finalized_at, voided_at, items]
      properties:
        id: { type: string, format: uuid }
        group_id: { type: string, format: uuid }
        payer_id: { type: string, format: uuid }
        description: { type: string }
        status: { type: string, enum: [parsing, needs_review, claiming, finalized, void] }
        version: { type: integer, description: Optimistic-lock counter for item edits. }
        currency: { type: string, enum: [CAD, USD], description: The group's currency. }
        tax_minor: { type: integer, format: int64 }
        tip_minor: { type: integer, format: int64 }
        subtotal_minor: { type: integer, format: int64, description: Sum of item prices. }
        total_minor: { type: integer, format: int64, description: "subtotal + tax + tip. Derived, never stored." }
        created_at: { type: string, format: date-time }
        finalized_at: { type: string, format: date-time, nullable: true }
        voided_at: { type: string, format: date-time, nullable: true }
        items:
          type: array
          items: { $ref: "#/components/schemas/ExpenseItem" }
    FinalizedExpense:
      allOf:
        - $ref: "#/components/schemas/Expense"
        - type: object
          required: [ledger_transaction_id, shares]
          properties:
            ledger_transaction_id: { type: string, format: uuid }
            shares:
              type: array
              description: What each claimant owes for this expense (the payer's own share included), sorted by member id. Totals sum to the expense total.
              items:
                type: object
                required: [member_id, subtotal_minor, tax_minor, tip_minor, total_minor]
                properties:
                  member_id: { type: string, format: uuid }
                  subtotal_minor: { type: integer, format: int64 }
                  tax_minor: { type: integer, format: int64 }
                  tip_minor: { type: integer, format: int64 }
                  total_minor: { type: integer, format: int64 }
    Balances:
      type: object
      required: [currency, balances, suggested_transfers]
      properties:
        currency: { type: string, enum: [CAD, USD] }
        balances:
          type: array
          description: One entry per current member, in the order they joined.
          items:
            type: object
            required: [member_id, display_name, balance_minor]
            properties:
              member_id: { type: string, format: uuid }
              display_name: { type: string }
              balance_minor: { type: integer, format: int64, description: "Positive: the group owes them. Negative: they owe the group." }
        suggested_transfers:
          type: array
          description: Payments that would bring every balance to zero. Suggestions only; the count is reduced, not minimized.
          items:
            type: object
            required: [from_member_id, to_member_id, amount_minor]
            properties:
              from_member_id: { type: string, format: uuid, description: Pays. }
              to_member_id: { type: string, format: uuid, description: Receives. }
              amount_minor: { type: integer, format: int64, minimum: 1 }
    VoidedExpense:
      allOf:
        - $ref: "#/components/schemas/Expense"
        - type: object
          required: [ledger_transaction_id, reversed_ledger_transaction_id]
          properties:
            ledger_transaction_id: { type: string, format: uuid, description: The new reversing posting. }
            reversed_ledger_transaction_id: { type: string, format: uuid, description: The finalize posting it cancels. }
    ExpenseSummary:
      type: object
      required: [id, payer_id, description, status, currency, item_count, subtotal_minor, total_minor, created_at]
      properties:
        id: { type: string, format: uuid }
        payer_id: { type: string, format: uuid }
        description: { type: string }
        status: { type: string, enum: [parsing, needs_review, claiming, finalized, void] }
        currency: { type: string, enum: [CAD, USD] }
        item_count: { type: integer }
        subtotal_minor: { type: integer, format: int64 }
        total_minor: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
    Settlement:
      type: object
      required: [id, group_id, from_member_id, to_member_id, amount_minor, currency, status, failure_code, ledger_transaction_id, created_at, resolved_at]
      properties:
        id: { type: string, format: uuid }
        group_id: { type: string, format: uuid }
        from_member_id: { type: string, format: uuid, description: The sender, who created the settlement. }
        to_member_id: { type: string, format: uuid }
        amount_minor: { type: integer, format: int64, minimum: 1 }
        currency: { type: string, enum: [CAD, USD] }
        status:
          type: string
          enum: [pending, succeeded, failed, unknown]
          description: >
            `pending` until the provider answers. `unknown` means the answer was ambiguous (for example a
            timeout) and the settlement will be reconciled; it still reserves the money. `succeeded` and
            `failed` are final.
        failure_code: { type: string, nullable: true, description: "The provider's decline reason; set only when `failed`." }
        ledger_transaction_id: { type: string, format: uuid, nullable: true, description: "The ledger posting; set only when `succeeded`." }
        created_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true, description: "Set when `succeeded` or `failed`." }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
  responses:
    Unauthorized:
      description: Missing, invalid, or expired token.
      headers:
        WWW-Authenticate: { schema: { type: string, enum: [Bearer] } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Malformed or invalid request body.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found (or not visible to the caller).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: The caller can see the group but is not allowed to do this (not the owner).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotClaimable:
      description: The expense is not in status `claiming` (it is being reviewed, finalized or void), so claims cannot change.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    KeyReuse:
      description: The Idempotency-Key was already used with a different request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Rate limited.
      headers:
        Retry-After: { schema: { type: integer }, description: Seconds until the next attempt may succeed. }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
