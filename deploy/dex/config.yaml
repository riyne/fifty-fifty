# Dex for local development. Static synthetic users only.
# All three users have the password "password". Never use this config anywhere real.
#
# The issuer URL must be identical from every vantage point that validates tokens
# (the iOS Simulator shares localhost with the host, so one URL serves the app and the api).
# Revisit if the api is containerized or Android is added.
issuer: http://localhost:5556/dex

# Postgres, not memory: refresh tokens deadlock Dex's in-memory storage (see Dockerfile). The
# database and role are made by deploy/dex/create-db.sql (`make up` runs it). host.docker.internal
# is the host's published Postgres port: it works from compose on Docker Desktop and, with
# `--add-host=host.docker.internal:host-gateway`, from the CI runner.
storage:
  type: postgres
  config:
    host: host.docker.internal
    port: 5433
    database: dex
    user: dex
    password: dex
    ssl:
      mode: disable

# Short ID tokens, refresh tokens for staying signed in. The app sends the ID token
# to the api, so a short lifetime limits what a stolen one is worth; the refresh token is kept
# in the iOS Keychain and rotated on every use (a used token is refused).
expiry:
  idTokens: 1h
  refreshTokens:
    validIfNotUsedFor: 168h
    absoluteLifetime: 720h

web:
  http: 0.0.0.0:5556

oauth2:
  skipApprovalScreen: true
  # PKCE is required, and only S256. Without this Dex issued and exchanged a code for
  # this public client with no code_challenge at all, and accepted the `plain` method (the
  # verifier itself sent in the authorization URL). The app and scripts/dev-token.sh already
  # send S256; test/oidc/pkce_test.go checks that nothing else is accepted.
  pkce:
    enforce: true
    codeChallengeMethodsSupported:
      - S256

enablePasswordDB: true

staticClients:
  - id: fifty-fifty
    name: Fifty Fifty
    public: true # public client: Auth Code + PKCE, no secret
    redirectURIs:
      # scripts/dev-token.sh (a dev login with curl; it only reads the code from the redirect,
      # the api has no such route).
      - http://localhost:8080/callback
      # The mobile app: the scheme in mobile/app.json and the path from
      # mobile/src/auth/oidc.ts. A public client must match a registered URI exactly.
      - fiftyfifty://auth

staticPasswords:
  - email: alice@example.com
    hash: "$2a$10$teSEim0RrCd94a.j6Bmm..lBUsbF79z2VbqNby/WdJKTqMn8aAZYC"
    username: alice
    userID: 6f1f4f0e-0a1b-4c5d-8e21-000000000001
  - email: bob@example.com
    hash: "$2a$10$teSEim0RrCd94a.j6Bmm..lBUsbF79z2VbqNby/WdJKTqMn8aAZYC"
    username: bob
    userID: 6f1f4f0e-0a1b-4c5d-8e21-000000000002
  - email: carol@example.com
