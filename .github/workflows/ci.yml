name: ci

# Runs `make ci`: gofmt, go vet (production build and the unsafe_controls build), a check that
# `make generate` leaves no diff, the tests against a real Postgres and a real tesseract with
# skips for a missing database or a missing tesseract turned into failures, the whole suite again with the unsafe_controls tag and nothing
# disabled, and govulncheck. Not here: the end-to-end and stress tests, the negative controls
# and the benchmarks (real processes, minutes, timing). Lint (golangci-lint, pinned in
# tools/go.mod) is part of `make ci`. A second job,
# `secrets`, scans the git history with gitleaks (not part of `make ci`).
# The same gates run on a developer machine with `make up && make migrate-up && make ci`.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fifty
          POSTGRES_PASSWORD: fifty
          POSTGRES_DB: fifty
        # 5433 on the runner, as on a developer machine, so the Makefile's URLs work unchanged.
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U fifty -d fifty"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      # Actions are pinned to a commit SHA, not a tag, so a moved tag cannot change what
      # runs. The comment names the release; Dependabot (.github/dependabot.yml) bumps both.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # The OCR tests run the real tesseract program (REQUIRE_TESSERACT=1 in `make ci`
      # makes a missing one a failure). The runner's apt version differs from the one
      # results were recorded with; the tests only check that it reads clean renders.
      - name: Install tesseract
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - name: Apply migrations
        run: make migrate-up
      - name: Run the gates
        run: make ci

  # Secret scan over the whole git history (it needs every commit, hence fetch-depth: 0).
  # gitleaks is a pinned release whose SHA-256 is checked before it runs. The checksum comes
  # from the same release page, so it guards against a corrupt or later-replaced download,
  # not against a compromised release. .gitleaksignore holds the one known false positive.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1
        run: |
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan the history
        run: ./gitleaks git . --redact --no-banner -v

  # The app's own checks (M10.6): typecheck, the generated api types are current with
  # api/openapi.yaml, and the Jest tests. Nothing here builds the app or needs a simulator;
  # `make mobile-check` runs the same thing by hand. Node 24 is what the lockfile was made with.
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run check
